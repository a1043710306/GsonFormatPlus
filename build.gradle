plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

intellij {
    plugins 'java'
    def localIdeaPath = findProperty('ideaPath') ?: System.getenv('IDEA_HOME')
    if (localIdeaPath != null && file(localIdeaPath).exists()) {
        localPath localIdeaPath
    } else {
        version ideaVersion
    }
    pluginName 'GsonFormatPlus'
    updateSinceUntilBuild false
}

sourceCompatibility = javaVersion
targetCompatibility = javaVersion

repositories {
    mavenCentral()
}


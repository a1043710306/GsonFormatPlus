plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.20.0'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

def localIdeaPath = findProperty('ideaPath') ?: System.getenv('IDEA_HOME')

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.swinglabs:swingx-core:1.6.2-2'
    intellijPlatform {
        if (localIdeaPath != null && file(localIdeaPath).exists()) {
            local(localIdeaPath)
        } else {
            intellijIdeaUltimate(ideaVersion)
        }
        bundledPlugin('com.intellij.java')
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '263'
        }
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

